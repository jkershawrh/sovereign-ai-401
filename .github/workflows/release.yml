name: Release immutable factory candidates
on:
  workflow_dispatch:
    inputs:
      expected_sha: {description: Exact source revision, required: true, type: string}
permissions:
  contents: read
  packages: write
  id-token: write
env:
  REGISTRY: ghcr.io
jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.expected_sha }}"}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
  release:
    needs: qualify
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - {component: presentation, file: Containerfile, image: sovereign-ai-401-presentation}
          - {component: qualifier, file: workload/Containerfile, image: sovereign-ai-401-qualifier}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.expected_sha }}"}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Build linux amd64 candidate
        run: docker buildx build --platform linux/amd64 --file "${{ matrix.file }}" --label "org.opencontainers.image.revision=${{ inputs.expected_sha }}" --tag "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.expected_sha }}" --load .
      - name: Full vulnerability inventory and zero HIGH/CRITICAL gate
        uses: anchore/scan-action@v6
        with: {image: "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.expected_sha }}", severity-cutoff: high, fail-build: true, output-format: json, output-file: "vulnerability-${{ matrix.component }}.json"}
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with: {image: "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.expected_sha }}", format: spdx-json, output-file: "sbom-${{ matrix.component }}.spdx.json", upload-artifact: false}
      - name: Publish exact candidate
        id: publish
        run: |
          image="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.expected_sha }}"
          docker push "$image"
          digest_ref="$(docker inspect --format='{{index .RepoDigests 0}}' "$image")"
          test -n "$digest_ref"
          docker pull "$digest_ref"
          test "$(docker inspect --format='{{.Architecture}}' "$digest_ref")" = amd64
          printf 'digest_ref=%s\n' "$digest_ref" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$digest_ref" > "image-${{ matrix.component }}.txt"
      - uses: sigstore/cosign-installer@v3.8.2
      - name: Sign and attest with GitHub OIDC
        env: {DIGEST_REF: "${{ steps.publish.outputs.digest_ref }}"}
        run: |
          cosign sign --yes "$DIGEST_REF"
          cosign attest --yes --type spdxjson --predicate "sbom-${{ matrix.component }}.spdx.json" "$DIGEST_REF"
          printf '{"builder":{"id":"%s"},"buildType":"https://github.com/Attestations/GitHubActionsWorkflow@v1","invocation":{"configSource":{"uri":"git+%s/%s","digest":{"sha1":"%s"},"entryPoint":".github/workflows/release.yml"}},"metadata":{"buildInvocationId":"%s"},"materials":[]}\n' "${{ github.workflow_ref }}" "${{ github.server_url }}" "${{ github.repository }}" "${{ inputs.expected_sha }}" "${{ github.run_id }}" > provenance.json
          cosign attest --yes --type slsaprovenance --predicate provenance.json "$DIGEST_REF"
      - name: Verify signature and attestations
        env: {DIGEST_REF: "${{ steps.publish.outputs.digest_ref }}"}
        run: |
          identity="${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify --certificate-identity="$identity" --certificate-oidc-issuer="$issuer" "$DIGEST_REF" > signature-verification.json
          cosign verify-attestation --type spdxjson --certificate-identity="$identity" --certificate-oidc-issuer="$issuer" "$DIGEST_REF" > sbom-verification.json
          cosign verify-attestation --type slsaprovenance --certificate-identity="$identity" --certificate-oidc-issuer="$issuer" "$DIGEST_REF" > provenance-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: "sovereign-ai-401-${{ matrix.component }}-${{ inputs.expected_sha }}"
          retention-days: 90
          path: |
            image-${{ matrix.component }}.txt
            vulnerability-${{ matrix.component }}.json
            sbom-${{ matrix.component }}.spdx.json
            provenance.json
            *-verification.json
