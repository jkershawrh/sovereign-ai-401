{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ .Release.Name }}-default-deny}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/part-of: sovereign-ai-401}}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ .Release.Name }}-qualifier-ingress}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: {{ .Release.Name }}-qualifier}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: {{ .Release.Name }}-presentation}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: showroom}}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ .Release.Name }}-presentation-egress}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: {{ .Release.Name }}-presentation}}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: {{ .Release.Name }}-qualifier}}
      ports: [{protocol: TCP, port: 8080}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: openshift-dns}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ .Release.Name }}-presentation-route}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: {{ .Release.Name }}-presentation}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports: [{protocol: TCP, port: 8080}]
{{- end }}
