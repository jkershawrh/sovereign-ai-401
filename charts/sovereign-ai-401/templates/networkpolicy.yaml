{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ .Release.Name }}-default-deny}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/part-of: sovereign-ai-401}}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ .Release.Name }}-allow-http}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/part-of: sovereign-ai-401}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
      ports: [{protocol: TCP, port: 8080}]
{{- end }}
