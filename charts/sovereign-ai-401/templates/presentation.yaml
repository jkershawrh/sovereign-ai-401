apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Release.Name }}-presentation}
spec:
  replicas: {{ .Values.presentation.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ .Release.Name }}-presentation}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ .Release.Name }}-presentation, app.kubernetes.io/part-of: sovereign-ai-401}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: presentation
          image: "{{ .Values.images.presentation.repository }}@{{ .Values.images.presentation.digest }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /readyz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true, runAsNonRoot: true}
          resources: {{- toYaml .Values.presentation.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: nginx-tmp, mountPath: /var/lib/nginx/tmp}
            - {name: nginx-run, mountPath: /run}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 16Mi}}
        - {name: nginx-tmp, emptyDir: {sizeLimit: 16Mi}}
        - {name: nginx-run, emptyDir: {sizeLimit: 1Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: {{ .Release.Name }}-presentation}
spec:
  selector: {app.kubernetes.io/name: {{ .Release.Name }}-presentation}
  ports: [{name: http, port: 8080, targetPort: http}]
