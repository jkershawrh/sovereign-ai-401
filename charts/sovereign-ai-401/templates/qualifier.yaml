apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Release.Name }}-qualifier}
spec:
  replicas: {{ .Values.qualifier.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ .Release.Name }}-qualifier}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ .Release.Name }}-qualifier, app.kubernetes.io/part-of: sovereign-ai-401}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: qualifier
          image: "{{ .Values.images.qualifier.repository }}@{{ .Values.images.qualifier.digest }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - {name: SOURCE_STATE, value: {{ .Values.sourceState | quote }} }
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true, runAsNonRoot: true}
          resources: {{- toYaml .Values.qualifier.resources | nindent 12 }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 16Mi}}]
---
apiVersion: v1
kind: Service
metadata: {name: {{ .Release.Name }}-qualifier}
spec:
  selector: {app.kubernetes.io/name: {{ .Release.Name }}-qualifier}
  ports: [{name: http, port: 8080, targetPort: http}]
